version: "3.9"

networks:
  chatdoc:
    driver: bridge

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chatdoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatdoc_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chatdoc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [chatdoc]
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatdoc} -d ${POSTGRES_DB:-chatdoc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chatdoc-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
    volumes:
      - redis_data:/data
    networks: [chatdoc]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ─── Qdrant ───────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: chatdoc-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [chatdoc]
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─── Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatdoc-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chatdoc}:${POSTGRES_PASSWORD:-chatdoc_secret}@postgres:5432/${POSTGRES_DB:-chatdoc}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # Only set OLLAMA_URL if you start Ollama with --profile ollama
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-deploying}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend/storage:/app/storage
    networks: [chatdoc]
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Celery Worker ────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chatdoc-celery-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 -Q default
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chatdoc}:${POSTGRES_PASSWORD:-chatdoc_secret}@postgres:5432/${POSTGRES_DB:-chatdoc}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-deploying}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - ./backend/storage:/app/storage
    networks: [chatdoc]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: chatdoc-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    networks: [chatdoc]
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # ─── Ollama ───────────────────────────────────────────────────────────────
  # NOT started by default. To enable:
  #   docker compose --profile ollama up
  # Then pull a model:
  #   docker exec chatdoc-ollama ollama pull llama3
  #   docker exec chatdoc-ollama ollama pull nomic-embed-text
  ollama:
    image: ollama/ollama:latest
    container_name: chatdoc-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks: [chatdoc]
    ports:
      - "127.0.0.1:11434:11434"
    profiles: [ollama]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
